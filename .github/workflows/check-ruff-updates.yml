name: Check Ruff Version Updates

# Automated check for ruff updates - runs monthly
# Creates a PR when new stable ruff version is available

on:
  schedule:
    # Run on first day of each month at 9 AM UTC
    - cron: '0 9 1 * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  check-ruff-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Get current ruff version
        id: current
        run: |
          CURRENT_VERSION=$(grep -A 1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml | grep 'rev:' | sed 's/.*v//' | tr -d ' ')
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current ruff version: $CURRENT_VERSION"

      - name: Get latest ruff version
        id: latest
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/astral-sh/ruff/releases/latest | jq -r .tag_name | sed 's/v//')
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Latest ruff version: $LATEST_VERSION"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          if [ "$CURRENT" = "$LATEST" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "✅ Ruff is up to date (v$CURRENT)"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "🆕 Update available: v$CURRENT → v$LATEST"
          fi

      - name: Install ruff latest version
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          pip install ruff==${{ steps.latest.outputs.version }}

      - name: Update configuration files
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          LATEST="${{ steps.latest.outputs.version }}"

          # ANCHORED to the ruff repo (#2123). Unanchored, this rewrote EVERY `rev:` line --
          # `.pre-commit-config.yaml` also pins `pre-commit/pre-commit-hooks`, and `sed`'s `s///`
          # applies once PER LINE, not per file. Simulated at LATEST=0.17.0, the old expression set
          # pre-commit-hooks from v6.0.0 to v0.17.0, a tag that does not exist, so `pre-commit`
          # could not fetch ANY hook environment and the bot's own PR opened with every hook broken.
          # It has not fired yet only because it runs on needs_update, and no bot PR has merged
          # since that second `rev:` line was added.
          sed -i "/astral-sh\/ruff-pre-commit/,/rev:/ s/rev: v[0-9.]\+/rev: v$LATEST/" .pre-commit-config.yaml

          # The guard, because an anchored expression comes unanchored again in one edit and
          # nothing downstream notices: a broken pin fails at `pre-commit install-hooks`, in the
          # bot's PR, and that PR's own status checks stay green because no workflow runs
          # pre-commit. It lands on main invisibly and then blocks every contributor's push.
          #
          # It checks IDENTITY, not a line count. A count of 1 is satisfied by two configurations
          # that reproduce the original defect with this fix in place -- a ruff block whose `rev:`
          # precedes its `repo:`, and a ruff block with no `rev:` at all; in both the range lands on
          # pre-commit-hooks and changes exactly one line. Re-reading the pin the way ci.yml does
          # rules out both.
          bumped=$(grep -A1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml \
                   | grep -oE 'rev: v[0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ "$bumped" != "$LATEST" ]; then
            echo "::error::after the bump the ruff pin reads '${bumped:-<unreadable>}', expected '$LATEST'"
            git diff .pre-commit-config.yaml
            exit 1
          fi
          # and nothing else moved
          changed=$(git diff --numstat .pre-commit-config.yaml | awk '{print $1}')
          if [ "${changed:-0}" != "1" ]; then
            echo "::error::the bump changed ${changed:-0} lines, expected exactly 1"
            git diff .pre-commit-config.yaml
            exit 1
          fi

          # No second pin to update. `modern_quality.yml` was sed'd here for a `ruff==` line that
          # moved out of it -- that file now says "Ruff formatting and linting (covered by ci.yml
          # quick-checks)" and contains the string zero times, so the step was a no-op. `ci.yml`
          # holds no pin either: it READS the version out of `.pre-commit-config.yaml` at runtime
          # in its `RUFF_VERSION=$(grep ...)` line. One owner, one edit. (#2123)

          echo "Updated ruff version to $LATEST"

      - name: Run ruff format
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          ruff format . || true

      - name: Generate changelog snippet
        if: steps.compare.outputs.needs_update == 'true'
        id: changelog
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"

          cat > /tmp/ruff_changes.md << 'EOF'
          ## Ruff Update: v$CURRENT → v$LATEST

          This PR updates ruff to the latest stable version.

          ### Changes
          - Updated `.pre-commit-config.yaml`: `v$CURRENT` → `v$LATEST`
          - Applied formatting changes (if any)

          ### Review Checklist
          - [ ] Review formatting changes
          - [ ] Run local tests: `pytest tests/`
          - [ ] Check pre-commit hooks: `pre-commit run --all-files`

          ### Ruff Release Notes
          See: https://github.com/astral-sh/ruff/releases/tag/v$LATEST

          ---

          🤖 This PR was automatically generated by the ruff update checker.
          📅 Scheduled check runs monthly on the 1st.
          🔧 To run manually: Actions → Check Ruff Version Updates → Run workflow
          EOF

          sed -i "s/\$CURRENT/$CURRENT/g" /tmp/ruff_changes.md
          sed -i "s/\$LATEST/$LATEST/g" /tmp/ruff_changes.md

      - name: Create Pull Request
        if: steps.compare.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: Update ruff from v${{ steps.current.outputs.version }} to v${{ steps.latest.outputs.version }}

            Automated ruff version update with formatting changes.

            🤖 Generated by ruff update checker
          branch: chore/update-ruff-${{ steps.latest.outputs.version }}
          delete-branch: true
          title: 'chore: Update ruff to v${{ steps.latest.outputs.version }}'
          body-path: /tmp/ruff_changes.md
          labels: |
            dependencies
            tooling
            automated

      - name: Summary
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          NEEDS_UPDATE="${{ steps.compare.outputs.needs_update }}"

          if [ "$NEEDS_UPDATE" = "true" ]; then
            echo "✅ Created PR to update ruff: v$CURRENT → v$LATEST"
            echo "📋 Review the PR and merge when ready"
          else
            echo "✅ Ruff is up to date at v$CURRENT"
            echo "📅 Next check: 1st of next month"
          fi
