# A close that takes the last open carrier of a backlog blocker label, or the last open member of a
# backlog family, opens a notice. `scripts/family_queue.py --closed` decides; this file only runs it.
#
# Not a notice on every close. Measured 2026-09-24 over issues created or closed 2026-08-22 to
# 2026-09-21 (search API): 207 opened and 140 closed, peaking at 45 events on 2026-09-05. A line on
# every close is scenery -- a signal that fires identically every time carries no information. The
# sub-event happened once in that window: #1991 took the last `blocks: no-convergence-obligation` on
# 2026-09-13, and nothing noticed for eight days while the family it unblocks sat with eleven open
# members.
#
# No loop guard is needed and none is written: a notice carries no `family:` or `blocks:` label, so
# closing it produces no event. That is a property of the design rather than a check, which is why it
# is stated here instead of coded.

name: A backlog family emptied

on:
  issues:
    types: [closed]
  # `issues:` events always read the workflow definition from the DEFAULT branch, unlike
  # `pull_request`. So this file cannot run at all until it is merged -- there is no branch on which
  # to verify it, and the merge is the act that makes it live. Measured: `gh run list` returns
  # `404 ... not found on the default branch`. This dispatch is the only route to exercising it with
  # a chosen issue after the merge, and it prints without posting unless `post` is set, so replaying
  # an old close does not open a notice for it.
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to evaluate as if it had just been closed"
        required: true
        type: number
      post:
        description: "Open the notices, instead of only printing them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

# No `concurrency:` group, on purpose: see `post()` in scripts/family_queue.py. One pull request
# closing several issues runs this once per issue, and a group would cancel the pending runs.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The instrument before its answer. This is the ONLINE half of the self-test: it asserts that
      # the order file's labels exist. The local gate runs the offline half, which drives the
      # decision itself, and deliberately not this one, because that gate makes no network call.
      - name: Self-test the instrument
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/family_queue.py --self-test --online

      # The issue number reaches the shell through `env:`, never as template text in `run:`.
      - name: Report what this close changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          POST: ${{ github.event_name == 'issues' || inputs.post }}
        run: |
          if [ "$POST" = "true" ]; then
            python3 scripts/family_queue.py --closed "$ISSUE" --post
          else
            python3 scripts/family_queue.py --closed "$ISSUE"
          fi
