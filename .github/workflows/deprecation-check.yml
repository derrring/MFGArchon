name: Deprecation Policy Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-deprecation:
    name: Check internal deprecated API usage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The check reads the RUNTIME registry (Issue #1713), so the package has to be importable.
      # The previous AST-only version did not need this, which is why the step never existed.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,numerical]"

      - name: Run deprecation check
        run: |
          echo "Checking declared deprecations against the recorded baseline..."
          python scripts/check_internal_deprecation.py

      # No message here about WHY it failed. The check prints its own reason -- a count that moved,
      # or a production call site -- and a fixed string asserting one of them was wrong for the
      # other, and wrong again for an ImportError (Issue #1713).
      - name: Report status
        if: failure()
        run: |
          echo "Deprecation check failed. Its output above names the reason."
          echo "If the counts moved deliberately, regenerate with:"
          echo "  python scripts/check_internal_deprecation.py --write-baseline"
          exit 1
