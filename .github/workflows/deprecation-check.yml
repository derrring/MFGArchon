name: Deprecation Policy Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-deprecation:
    name: Check internal deprecated API usage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The check reads the RUNTIME registry (Issue #1713), so the package has to be importable.
      # The previous AST-only version did not need this, which is why the step never existed.
      #
      # `numba` is here and torch is NOT, and both halves are measured rather than guessed. The
      # check refuses when a module IN SCOPE cannot be imported, so the question is which optional
      # distributions the live library needs to be readable end to end. Blocking each in turn:
      # numba is the only one -- `backends/numba_backend.py` raises a deliberate ImportError
      # without it. The eighteen modules torch used to cost lived under alg/neural and
      # alg/reinforcement, which are deleted, so the count no longer depends on the wheel at all
      # and there is still no 2 GB download on the critical path of a PR.
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,numerical]" numba

      # The check prints its own reason and its own remedy, and there are now three of each: a
      # count that moved (regenerate the baseline), a production call site (stop calling it), and
      # a tree this runner cannot read in full (install the extra -- and specifically do NOT
      # regenerate). A trailing step echoing one fixed remedy was wrong for the other two, and the
      # one it named is the one that would bake a wrong count into the baseline (Issue #1713).
      - name: Run deprecation check
        run: |
          echo "Checking declared deprecations against the recorded baseline..."
          python scripts/check_internal_deprecation.py
