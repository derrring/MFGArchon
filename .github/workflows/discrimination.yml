name: Weekly Test-Discrimination Sweep

# Measures which tests notice a change to a convention the library single-sources,
# by mutating each one and running the suite. Weekly, not nightly: it is one full suite run per
# mutation plus a baseline -- `1 + len(MUTATIONS)` runs, not a fixed number (#2349) -- and the
# quantity it tracks moves on the timescale of a campaign, not a commit.
#
# It answers what #1715 asked and #1701 generalises. Measured 2026-09-10 at 2c923694 over
# 3,822 collected tests (#2285): 665 (17.4%) notice at least one of the 24 conventions and
# none is left undefended. ~~2026-07-27, 5,665 collected, 184 (3.2%), six conventions~~
# -- that read predates the #2227 reset, which removed 2,927 collected tests.
#
# Do not restate the cost here; derive it from the matrix, which records `baseline_seconds`
# and a per-mutation `seconds`. At 2c923694 that is 198.2 + 3814.6 s = 67 min.
#
# The ratchet is per-mutation kill COUNTS, not test names. That is deliberate: this
# population cannot be selected by name at all. `*_agree` / `*_matches` / `*_equals`
# gives 51, 114 or 156 depending on the pattern, and 60% of the tests whose names
# claim cross-path agreement notice none of the conventions at all. ("none of the six"
# until #2349: the alphabet had six entries in the 2026-07-27 read this file strikes as
# superseded nine lines above, and the count is owned by `MUTATIONS`.)

on:
  schedule:
    # 04:00 UTC on Mondays, after nightly has finished.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  discrimination:
    name: mutation sweep (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Sharded because one job no longer fits (#2389). Run 34828814112 (2026-09-14) took 294 min
    # against a 300 cap, and run 35584381059 a week later was cancelled at it. That 294 against the
    # 136.1 min the matrix derivation gave locally at 76f2d9e8 four days later is ~2.2x, a rough
    # ratio across two trees. `--shard K/N` takes every N-th mutation starting at K, which
    # partitions the list for any N, so a mutation added later needs no assignment. The matrix now
    # records 165.2 min locally (measured at 27d45c19): at N = 5 its largest slice is 2225 s, and
    # each shard also pays the 332 s baseline, so ~94 min on a runner at 2.2x against 180. Change N
    # by editing the list; `strategy.job-total` carries it to `--shard`.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    # numba for the same measured reason nightly.yml and deprecation-check.yml carry it: without
    # it `mfgarchon.backends.numba_backend` -- LIVE library, not a frozen paradigm -- cannot be
    # imported, and the deprecation-guide tests refuse a tree whose live half they cannot read
    # (#1836). This tier runs `pytest tests` in full, so it hits exactly the same three errors.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[numerical]" --group dev numba
        # Positive control for #1658: `.[dev,numerical]` once resolved to nothing for 3.5 months
        # and the only observable was a SOCP ImportError inside the suite. A skip-based design
        # removes that observable, so the install has to prove itself here instead.
        python -c "import cvxpy; print('cvxpy', cvxpy.__version__)"

    # NOTE: --paths defaults to `tests`, which includes tests/unit/test_backends and
    # tests/unit/test_visualization. nightly.yml deliberately --ignores both (see its
    # comment: they "run in no AUTOMATIC workflow"), so this is the first automatic tier
    # to execute them, on Linux, where they have never run. They pass locally and the
    # marker set here is byte-identical to local_ci.sh, but if they are red on a runner
    # the baseline gate aborts the whole job with a clear message rather than producing
    # a wrong number. Exercise once via workflow_dispatch before trusting the schedule.
    - name: Sweep and compare against the baseline
      env:
        OMP_NUM_THREADS: 1
        OPENBLAS_NUM_THREADS: 1
      run: |
        # The path is the COMMITTED one, matching AGENTS.md's local command, because the sweep
        # embeds it in the artifact's `reproduce` field: `git log --follow <path>`. A bare
        # `killmatrix.json` is not a committed path, so that instruction fatals with "ambiguous
        # argument" in the artifact a maintainer downloads to diagnose a failing sweep (#2349).
        # The checkout is ephemeral, so writing over the committed file costs nothing here.
        # `--check-baseline` reads its killer-set reference before the sweep, so writing `--json` over
        # the committed matrix no longer turns that comparison into the run against itself (#2389).
        python scripts/test_discrimination.py \
          --shard ${{ matrix.shard }}/${{ strategy.job-total }} \
          --check-baseline scripts/discrimination_baseline.json \
          --json scripts/discrimination_killmatrix.json

    - name: Upload the kill matrix
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: kill-matrix-shard-${{ matrix.shard }}
        path: scripts/discrimination_killmatrix.json
        retention-days: 90

  # Same reasoning as nightly.yml's notifier: a job nobody watches is a job that
  # reports nothing. Not gated on `schedule`, so workflow_dispatch exercises the
  # path too -- otherwise a bug in it surfaces only on a real weekly failure.
  notify-on-failure:
    needs: discrimination
    if: ${{ always() && needs.discrimination.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v9
      env:
        # A job that hits its time limit reports `cancelled`, not `failure` (run 35584381059), and the
        # two need different text: #2389 was a timeout reported as "discrimination dropped, a
        # mutation stopped applying, or the baseline is stale".
        RESULT: ${{ needs.discrimination.result }}
      with:
        script: |
          const date = new Date().toISOString().split('T')[0];
          const title = 'Weekly test-discrimination sweep is failing';
          const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const cancelled = process.env.RESULT === 'cancelled';
          const what = cancelled
            ? 'did not finish: at least one shard was cancelled, by its 180-minute limit or by hand'
            : 'failed';
          // Paginated, like nightly.yml. The unpaginated default is 30, so past that
          // this would stop finding its own issue and open a fresh duplicate weekly.
          const issues = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner, repo: context.repo.repo, state: 'open',
            labels: 'automated', per_page: 100,
          });
          const open = issues.find(i => i.title === title);
          const cause = cancelled
            ? [
                'A cancelled shard produced no verdict for its mutations, so this is not a',
                'discrimination result. The run lists which shard; its log shows how far it got.',
              ]
            : [
                'Either discrimination dropped (a convention fewer tests now notice), a mutation',
                'stopped applying because the source moved, or it improved and the baseline has',
                'not recorded it yet. The failing shard\'s output names which.',
              ];
          const body = [
            `The weekly mutation sweep ${what} on ${date}. Run: ${url}`,
            '',
            ...cause,
            '',
            'Reproduce one shard locally with `--shard K/5`, or all of it without; derive the cost',
            'from `baseline_seconds` + the per-mutation `seconds` in the kill matrix:',
            '```bash',
            'python scripts/test_discrimination.py --shard 1/5 --check-baseline scripts/discrimination_baseline.json',
            '```',
            '',
            'De-duplicated on title: subsequent failures comment here rather than opening new issues.',
          ].join('\n');
          if (open) {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: open.number, body: `The sweep ${what} again on ${date}. Run: ${url}`,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
              labels: ['automated', 'area: testing', 'priority: medium', 'type: bug'],
            });
          }

  # The closing edge. notify-on-failure had only an opening one: it filed or commented when a run
  # was not green and did nothing when one was, so an issue it created outlived its own cause until
  # a human swept it. #1806 recorded that for nightly.yml -- #1703 sat open at `priority: high`
  # through eight consecutive green nightlies -- and this workflow was left with the same shape.
  # Measured here: #1817 was filed 2026-08-03 for a red baseline that #1828 fixed on 2026-08-04, and
  # it was still open four days later because nothing closes it and the sweep is weekly.
  resolve-on-success:
    needs: discrimination
    # Literally 'success', not `success()` and not "did not fail": a shard that hits its 180-minute
    # limit reports `cancelled`, which is exactly the run that most needs the issue left open.
    if: ${{ needs.discrimination.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/github-script@v9
      with:
        script: |
          const date = new Date().toISOString().split('T')[0];
          const title = 'Weekly test-discrimination sweep is failing';
          const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          // Title AND the `automated` label, the pair notify-on-failure creates with. A
          // human-filed issue sharing the title carries no `automated` label and must survive:
          // a robot closing a person's issue is worse than a stale one.
          const existing = await github.paginate(github.rest.issues.listForRepo, {
            owner: context.repo.owner, repo: context.repo.repo, state: 'open',
            labels: 'automated', per_page: 100,
          });
          // `issues.listForRepo` returns pull requests too, and this job CLOSES what it selects
          // rather than only commenting. Identify them by the `pull_request` key and skip them.
          const open = existing.find(i => i.title === title && !i.pull_request);
          if (!open) {
            core.info('No open automated discrimination-failure issue to resolve.');
            return;
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number,
            body: [
              `The sweep is green as of ${date}; closing.`,
              '',
              `Run: ${url}`,
              '',
              'Filed and closed by `discrimination.yml`. If discrimination drops again a new issue',
              'is opened rather than this one reopened, so each report carries the run that',
              'produced it.',
            ].join('\n'),
          });
          await github.rest.issues.update({
            owner: context.repo.owner, repo: context.repo.repo, issue_number: open.number,
            state: 'closed', state_reason: 'completed',
          });
          core.info(`Closed #${open.number}.`);
