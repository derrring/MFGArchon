name: Security Scanning Pipeline
#
# Cost-optimized workflow: Manual triggers only to reduce GitHub Actions usage
#
# To run manually:
# 1. Go to GitHub repo → Actions tab → "Security Scanning Pipeline"
# 2. Click "Run workflow" → Select branch → Run
#
# Automatically runs on releases for security validation
#
# What leaves the runner: each scan job uploads one file, <job>-findings.json, which
# .github/scripts/security_findings.py writes from its allow-list of fields, FIELDS. Every scanner's
# stdout and stderr go to a file under $RUNNER_TEMP, and its report to $RUNNER_TEMP or the workspace;
# neither reaches the job log or an upload. Tools that can call out on their own run with that turned
# off: TruffleHog's verification and update check, detect-secrets' verification, Semgrep's metrics,
# Trivy's telemetry and version check, Safety's optional telemetry and its upload of results.

on:
  workflow_dispatch:  # Manual trigger only to reduce costs
  release:
    types: [published]  # Run security scans on releases

env:
  PYTHON_VERSION: '3.12'  # Package requires Python >=3.12

jobs:
  dependency-scanning:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-security-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-security-

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep pip-audit
        pip install -e . --group dev

    - name: Run Safety (dependency vulnerability scan)
      run: |
        echo "🔍 Scanning dependencies for known vulnerabilities..."
        safety --disable-optional-telemetry check --disable-audit-and-monitor --save-json "$RUNNER_TEMP/safety.json" > "$RUNNER_TEMP/safety.log" 2>&1 || true
      continue-on-error: true

    - name: Run pip-audit (comprehensive dependency audit)
      run: |
        echo "🔍 Running comprehensive dependency audit..."
        pip-audit --format=json --output="$RUNNER_TEMP/pip-audit.json" > "$RUNNER_TEMP/pip-audit.log" 2>&1 || true
      continue-on-error: true

    - name: Keep the allow-listed fields
      if: always()
      run: |
        python .github/scripts/security_findings.py dependency safety="$RUNNER_TEMP/safety.json" pip-audit="$RUNNER_TEMP/pip-audit.json"

    - name: Upload dependency findings
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: dependency-scan-results
        path: dependency-findings.json
        retention-days: 30

  static-code-analysis:
    name: Static Code Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install analysis tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml] semgrep
        pip install -e . --group dev

    - name: Run Bandit (Python security linter)
      run: |
        echo "🔍 Running Bandit security analysis..."
        bandit -r mfgarchon/ -f json -o "$RUNNER_TEMP/bandit.json" > "$RUNNER_TEMP/bandit.log" 2>&1 || true
      continue-on-error: true

    - name: Run Semgrep (multi-language static analysis)
      run: |
        echo "🔍 Running Semgrep security analysis..."
        # A named rule pack: Semgrep refuses --config=auto with metrics off.
        semgrep --config=p/python --metrics=off --json --output="$RUNNER_TEMP/semgrep.json" mfgarchon/ > "$RUNNER_TEMP/semgrep.log" 2>&1 || true
      continue-on-error: true

    - name: Custom security checks
      run: |
        echo "🔍 Running custom security checks..."
        python .github/scripts/custom_security_checks.py > "$RUNNER_TEMP/custom_security_checks.log" 2>&1

    - name: Keep the allow-listed fields
      if: always()
      run: |
        python .github/scripts/security_findings.py static bandit="$RUNNER_TEMP/bandit.json" semgrep="$RUNNER_TEMP/semgrep.json" custom_security_checks=custom-security-report.json

    - name: Upload static analysis findings
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: static-analysis-results
        path: static-findings.json
        retention-days: 30

  secrets-scanning:
    name: Secrets and Sensitive Data Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Full history for secret scanning

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install secret scanning tools
      run: |
        pip install detect-secrets gitpython
        # Install truffleHog
        curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

    - name: Run detect-secrets
      run: |
        echo "🔍 Scanning for secrets with detect-secrets..."
        cp .secrets.baseline "$RUNNER_TEMP/detect-secrets.json"
        detect-secrets scan --all-files --no-verify --baseline "$RUNNER_TEMP/detect-secrets.json" mfgarchon/ > "$RUNNER_TEMP/detect-secrets.log" 2>&1 || true

    - name: Run TruffleHog
      run: |
        echo "🔍 Scanning for secrets with TruffleHog..."
        trufflehog git file://. --json --no-verification --no-update > "$RUNNER_TEMP/trufflehog.json" 2> "$RUNNER_TEMP/trufflehog.log" || true
        echo "TruffleHog scan completed"

    - name: Custom secrets scan
      run: |
        echo "🔍 Running custom secrets detection..."
        python .github/scripts/custom_secrets_scan.py > "$RUNNER_TEMP/custom_secrets_scan.log" 2>&1

    - name: Keep the allow-listed fields
      if: always()
      run: |
        python .github/scripts/security_findings.py secrets detect-secrets="$RUNNER_TEMP/detect-secrets.json" trufflehog="$RUNNER_TEMP/trufflehog.json" custom_secrets_scan=custom-secrets-report.json

    - name: Upload secrets findings
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: secrets-scan-results
        path: secrets-findings.json
        retention-days: 30

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image for scanning
      run: |
        echo "🏗️ Building Docker image for security scanning..."
        docker build -t mfgarchon-security-scan:latest .

    - name: Install Trivy
      run: |
        sudo apt-get update
        sudo apt-get install wget apt-transport-https gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
        echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
        sudo apt-get update
        sudo apt-get install trivy

    - name: Run Trivy vulnerability scan
      run: |
        echo "🔍 Scanning container for vulnerabilities..."
        trivy image --disable-telemetry --skip-version-check --format json --output "$RUNNER_TEMP/trivy.json" mfgarchon-security-scan:latest > "$RUNNER_TEMP/trivy.log" 2>&1 || true

    - name: Install and run Hadolint (Dockerfile linter)
      run: |
        echo "🔍 Linting Dockerfile with Hadolint..."
        wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
        chmod +x hadolint
        ./hadolint --format json Dockerfile > "$RUNNER_TEMP/hadolint.json" 2> "$RUNNER_TEMP/hadolint.log" || true

    - name: Container configuration security check
      run: |
        echo "🔍 Checking container configuration security..."
        python .github/scripts/container_security_check.py > "$RUNNER_TEMP/container_security_check.log" 2>&1

    - name: Keep the allow-listed fields
      if: always()
      run: |
        python .github/scripts/security_findings.py container trivy="$RUNNER_TEMP/trivy.json" hadolint="$RUNNER_TEMP/hadolint.json" container_security_check=container-security-report.json

    - name: Upload container findings
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: container-scan-results
        path: container-findings.json
        retention-days: 30

  license-compliance:
    name: License Compliance Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install license checking tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-licenses licensecheck
        pip install -e . --group dev

    - name: Custom license compliance check
      run: |
        echo "📋 Running custom license compliance checks..."
        python .github/scripts/license_compliance_check.py > "$RUNNER_TEMP/license_compliance_check.log" 2>&1

    - name: Keep the allow-listed fields
      if: always()
      run: |
        python .github/scripts/security_findings.py license license_compliance_check=license-compliance-report.json

    - name: Upload license compliance findings
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: license-compliance-results
        path: license-findings.json
        retention-days: 30

  security-summary:
    name: Security Summary Report
    runs-on: ubuntu-latest
    needs: [dependency-scanning, static-code-analysis, secrets-scanning, container-security, license-compliance]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Download all scan results
      uses: actions/download-artifact@v8

    # download-artifact puts each artifact in a directory named after it.
    - name: Collect the five findings files
      run: |
        python .github/scripts/security_findings.py collect .

    - name: Generate comprehensive security report
      run: |
        echo "📊 Generating comprehensive security report..."
        python .github/scripts/generate_security_report.py

    - name: Upload comprehensive security report
      uses: actions/upload-artifact@v7
      with:
        name: comprehensive-security-report
        path: |
          security-dashboard.html
          security-summary.md
          security-findings.json
        retention-days: 90

    - name: Comment security summary on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const summaryPath = 'security-summary.md';

          if (fs.existsSync(summaryPath)) {
            const summary = fs.readFileSync(summaryPath, 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Scan Summary\n\n${summary}`
            });
          }

    - name: Fail job if critical vulnerabilities found
      run: |
        echo "🔍 Checking for critical security issues..."
        python .github/scripts/check_critical_issues.py

        # This script will exit with non-zero code if critical issues are found
        # Critical issues include:
        # - High/Critical severity vulnerabilities in dependencies
        # - Hardcoded secrets or credentials
        # - Critical security anti-patterns in code
        # - License compliance violations for production dependencies
