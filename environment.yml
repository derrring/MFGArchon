name: mfg_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python (required for NumPy 2.0+)
  - python=3.12

  # Core scientific computing with NumPy 2.0+
  - numpy>=2.0             # Native NumPy 2.0+ with trapezoid
  - scipy>=1.13            # NumPy 2.0+ compatible
  - matplotlib>=3.8        # Updated for NumPy 2.0+

  # Performance libraries
  - numba>=0.59           # NumPy 2.0+ support (CPU JIT)
  - jax>=0.4.20           # Latest with NumPy 2.0+ support (XLA compilation)
  - jaxlib                # JAX support library
  - pytorch>=2.0          # PyTorch for Phase 3 backend (CUDA/MPS/CPU)

  # Data processing
  - pandas>=2.1           # NumPy 2.0+ compatible
  - polars>=0.20          # Fast data processing
  - h5py>=3.9             # HDF5 files

  # Interactive computing
  - jupyter>=1.0
  - jupyterlab>=4.0
  - ipython>=8.12

  # Visualization
  - plotly>=5.17          # Interactive plotting
  - bokeh>=3.3            # Advanced visualizations
  - seaborn>=0.13         # Statistical plotting

  # Progress and utilities
  - tqdm>=4.0             # Progress bars (used throughout package)

  # Development tools (modern unified tooling)
  # EXACT, not a floor -- trial policy from #2147. The test is whether a tracked baseline changes
  # when this tool's version changes. It does: `scripts/warning_baseline.json` records 224 warning
  # identities and the gate fails on drift, and the set a run can emit is a property of the pytest
  # version. pytest 8 against 9 reported six identities GONE and one NEW over a two-file
  # documentation diff and went GATE RED, one of the six being `PytestRemovedIn10Warning`, which
  # pytest 8 cannot emit. For numpy, scipy, matplotlib and the rest nothing stores their output, so
  # a floor is right there and pinning them would fight contributors' environments for nothing.
  - pytest=9.1.1         # Testing framework -- exact, see above
  - pytest-benchmark     # Performance testing
  # Deliberately still a floor. ruff's output IS baselined, so by the test above it belongs in the
  # exact column -- and it already HAS an exact pin, in `.pre-commit-config.yaml`, which `ci.yml`
  # reads and `check-ruff-updates.yml` bumps monthly. A second `==` here would be a second owner for
  # one value, which is what #2135 spent a day removing. 49 releases in twelve months is the reason
  # not to pin it twice, not a reason to leave it unpinned.
  - ruff>=0.6.0          # Fast unified linting and formatting (replaces black+isort+flake8)
  - mypy>=1.5            # Type checking -- floor; see pyproject for why not exact
  - pre-commit>=2.0      # Pre-commit hooks

  # Documentation
  - sphinx>=7.0          # Documentation generation
  - sphinx-rtd-theme     # RTD theme
  - nbsphinx             # Jupyter notebook docs

  # System utilities
  - psutil>=5.9          # System monitoring
  - memory_profiler      # Memory profiling
  - line_profiler        # Line-by-line profiling

  # Package management
  - pip
  - conda-build          # For building packages

  # Additional pip packages
  - pip:
    - pydantic>=2.0      # Data validation
    - igraph>=0.10       # Graph algorithms
    - texttable          # Text tables
    - typing-inspection  # Runtime type inspection
