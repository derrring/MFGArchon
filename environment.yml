name: mfg_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python (required for NumPy 2.0+)
  - python=3.12

  # Core scientific computing with NumPy 2.0+
  - numpy>=2.0             # Native NumPy 2.0+ with trapezoid
  - scipy>=1.13            # NumPy 2.0+ compatible
  - matplotlib>=3.8        # Updated for NumPy 2.0+

  # Performance libraries
  - numba>=0.59           # NumPy 2.0+ support (CPU JIT)
  - jax>=0.4.20           # Latest with NumPy 2.0+ support (XLA compilation)
  - jaxlib                # JAX support library
  - pytorch>=2.0          # PyTorch for Phase 3 backend (CUDA/MPS/CPU)

  # Data processing
  - pandas>=2.1           # NumPy 2.0+ compatible
  - polars>=0.20          # Fast data processing
  - h5py>=3.9             # HDF5 files

  # Interactive computing

  # Visualization
  - plotly>=5.17          # Interactive plotting
  - bokeh>=3.3            # Advanced visualizations

  # Progress and utilities

  # Declared because the PACKAGE IMPORTS THEM. This file listed none of these while
  # `pyproject.toml` did, so an environment built from here alone cannot run the library or its
  # suite -- measured: 6630 test outcomes against 6724, with 66 tests skipped or not collected
  # because cvxpy and torch were absent. (#1687 did this reconciliation for `pyproject.toml` and
  # only for it; this is the same list arriving at the other manifest.)
  - cvxpy>=1.4             # Constrained optimisation (mfgarchon + tests)
  - scikit-fem>=8.0        # FEM assembly (imported as `skfem`)
  - meshio>=5.0            # Mesh I/O
  - networkx>=3.0          # Network geometry
  - osqp>=0.6              # QP solver behind the monotone schemes
  - nbformat>=5.0          # The package WRITES notebooks
  - pyyaml>=6.0            # `config/io.py` imports it at module level
  - rich>=13.0             # Progress bars -- the `tqdm` alias in utils/progress.py points here

  # Development tools (modern unified tooling)
  - pytest>=7.0          # Testing framework
  - pytest-benchmark     # Performance testing
  - ruff>=0.6.0          # Fast unified linting and formatting (replaces black+isort+flake8)
  - mypy>=1.5            # Type checking
  - pytest-xdist>=3.5    # `-n auto`, which the gate uses
  - pytest-timeout>=2.1  # `pytest.ini` sets `timeout = 900` under --strict-config, so this is
                         # not optional: without it collection fails with "Unknown config option"
  - pytest-cov>=4.0      # Coverage
  - pre-commit>=2.0      # Pre-commit hooks

  # Documentation
  - sphinx>=7.0          # Documentation generation
  - sphinx-rtd-theme     # RTD theme
  - nbsphinx             # Jupyter notebook docs

  # System utilities
  - psutil>=5.9          # System monitoring
  - memory_profiler      # Memory profiling
  - line_profiler        # Line-by-line profiling

  # Package management
  - pip
  - conda-build          # For building packages

  # Additional pip packages
  - pip:
    - pydantic>=2.0      # Data validation
    - igraph>=0.10       # Graph algorithms
    - typing-inspection  # Runtime type inspection
